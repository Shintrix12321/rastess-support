<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTESS | Техническая поддержка</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #90afc5;
            --bg: #050505;
            --card-bg: rgba(15, 15, 15, 0.95);
            --discord: #5865F2;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            font-family: 'Exo 2', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at center, #1a1c22 0%, #050505 100%);
            background-attachment: fixed; 
            color: #d1d1d1;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow-x: hidden;
        }

        .fog-layer {
            position: fixed; top: 0; left: 0; width: 200%; height: 100%;
            background: url('https://raw.githubusercontent.com/gist/PavelDoGreat/6748434/raw/2660233481222479e00ec9a4197e44a49646b5a3/fog.png');
            background-size: 50% 100%; opacity: 0.1; z-index: -1;
            animation: fogMove 80s linear infinite; pointer-events: none;
        }
        @keyframes fogMove { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* --- ОСНОВНОЕ МЕНЮ --- */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(144, 175, 197, 0.2);
            border-radius: 20px;
            padding: 40px; width: 90%; max-width: 600px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            text-align: center; box-sizing: border-box; margin: 40px 20px 20px;
            z-index: 10;
        }

        @media (max-width: 600px) {
            .container { padding: 25px 15px; }
            h1 { font-size: 2.2em !important; }
        }

        h1 { font-family: 'Play', sans-serif; font-size: 3.2em; margin: 0; letter-spacing: 8px; color: #fff; }
        .divider { height: 2px; width: 60px; background: var(--accent); margin: 20px auto 35px; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 0.8em; color: #888; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
        
        input, textarea {
            width: 100%; padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; color: #fff; font-family: inherit; font-size: 1em;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); background: rgba(144, 175, 197, 0.05); }

        .drop-zone {
            width: 100%; height: 120px;
            border: 2px dashed rgba(144, 175, 197, 0.3);
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; background: rgba(0, 0, 0, 0.3); color: #888; transition: 0.3s;
        }
        .drop-zone:hover { border-color: var(--accent); color: var(--accent); }

        /* --- ГАЛОЧКА --- */
        .safety-wrapper {
            display: flex; align-items: center; cursor: pointer;
            text-align: left; gap: 12px; margin: 20px 0;
            background: rgba(255, 255, 255, 0.02); padding: 12px; border-radius: 12px;
            transition: 0.3s;
        }
        .safety-wrapper:hover { background: rgba(255, 255, 255, 0.05); }
        .safety-wrapper input { display: none; }
        .custom-checkbox {
            width: 22px; height: 22px; border: 2px solid #444;
            border-radius: 6px; position: relative; flex-shrink: 0;
            transition: 0.3s;
        }
        .safety-wrapper input:checked + .custom-checkbox {
            background: var(--accent); border-color: var(--accent);
            box-shadow: 0 0 10px rgba(144, 175, 197, 0.5);
        }
        .custom-checkbox::after {
            content: "\f00c"; font-family: "Font Awesome 5 Free"; font-weight: 900;
            position: absolute; color: #000; font-size: 14px;
            top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            transition: 0.2s;
        }
        .safety-wrapper input:checked + .custom-checkbox::after { transform: translate(-50%, -50%) scale(1); }

        /* --- КНОПКА ОТПРАВИТЬ --- */
        .btn-main {
            width: 100%; padding: 18px;
            background: var(--accent); color: #000;
            border: none; border-radius: 12px;
            font-weight: bold; font-size: 1.2em;
            text-transform: uppercase; cursor: pointer; transition: all 0.4s ease;
            letter-spacing: 2px;
        }
        .btn-main:hover:not(:disabled) { 
            background: #fff; color: #000;
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
        }
        .btn-main:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }

        .btn-discord {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 25px; padding: 12px;
            background: rgba(88, 101, 242, 0.1);
            border: 1px solid rgba(88, 101, 242, 0.3);
            border-radius: 12px; color: var(--discord);
            text-decoration: none; font-weight: 600; transition: 0.3s;
        }
        .btn-discord:hover { background: var(--discord); color: #fff; }

        /* --- СЕКЦИЯ ПЛАТФОРМ (УЛУЧШЕНО) --- */
        .platform-section {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 50px;
            z-index: 10;
            animation: slideUp 1.5s ease-out;
        }
        .platform-title {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            margin-bottom: 15px;
            opacity: 0.6;
        }
        .platform-footer {
            display: flex; gap: 15px; justify-content: center;
        }
        .platform-link {
            text-decoration: none;
            color: #fff;
            font-size: 0.95em;
            display: flex; align-items: center; gap: 10px;
            padding: 12px 25px;
            border-radius: 12px;
            border: 1px solid rgba(144, 175, 197, 0.4);
            background: rgba(144, 175, 197, 0.05);
            transition: all 0.4s;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .platform-link:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .platform-link i {
            color: var(--accent);
            font-size: 1.3em;
            transition: 0.4s;
        }
        .platform-link:hover i { color: #fff; transform: scale(1.1); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #status { margin-top: 15px; font-size: 0.9em; font-weight: bold; min-height: 1.2em; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="fog-layer"></div>

    <div class="container">
        <h1>RASTESS</h1>
        <div class="divider"></div>
        
        <div class="form-group">
            <label>Никнейм</label>
            <input type="text" id="username" placeholder="Введите имя..." maxlength="32">
        </div>

        <div class="form-group">
            <label>Описание ошибки</label>
            <textarea id="description" rows="4" placeholder="Что произошло в тумане?"></textarea>
        </div>

        <div class="form-group">
            <label>Скриншот</label>
            <div class="drop-zone" id="drop-zone">
                <i class="far fa-images" style="font-size: 24px; margin-bottom: 5px;"></i>
                <span id="file-name">Нажмите или перетащите фото</span>
                <input type="file" id="screenshot" style="display:none" accept="image/png, image/jpeg, image/jpg">
            </div>
        </div>

        <label class="safety-wrapper" for="safety-confirm">
            <input type="checkbox" id="safety-confirm">
            <div class="custom-checkbox"></div>
            <div class="safety-text">Я подтверждаю, что вложения не нарушают правила сообщества.</div>
        </label>

        <button class="btn-main" id="submitBtn" onclick="sendReport()">Отправить</button>
        <div id="status"></div>

        <a href="https://discord.gg/jzzcdWeJVD" target="_blank" class="btn-discord">
            <i class="fab fa-discord"></i> Наш Discord
        </a>
    </div>

    <!-- Обновленная секция платформ -->
    <div class="platform-section">
        <div class="platform-title">Играть на платформах</div>
        <div class="platform-footer">
            <a href="https://shintrix.itch.io/rastess" target="_blank" class="platform-link">
                <i class="fab fa-itch-io"></i> ITCH.IO
            </a>
            <a href="https://gamejolt.com/games/rastess/1094649" target="_blank" class="platform-link">
                <i class="fas fa-gamepad"></i> GAMEJOLT
            </a>
        </div>
    </div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('screenshot');
    const fileNameDisplay = document.getElementById('file-name');
    const status = document.getElementById('status');
    const btn = document.getElementById('submitBtn');
    const safetyCheck = document.getElementById('safety-confirm');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) fileNameDisplay.textContent = `Выбрано: ${fileInput.files[0].name}`;
    });

    async function sendReport() {
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1541545132376203285/DoMDk6qcjb4-1qxweF_Z4WnZT8PIXmBxjhdtX4yYh0QHx1KF9q4Lpf6_5eJ0TzfhnKwX";
        const username = document.getElementById('username').value.trim() || "Аноним";
        const description = document.getElementById('description').value.trim();

        const lastSent = localStorage.getItem('lastReportSent');
        if (lastSent && (Date.now() - lastSent < 60000)) {
            status.innerHTML = "<span class='error'>Подождите минуту.</span>";
            return;
        }
        if (!description || !safetyCheck.checked) {
            status.innerHTML = "<span class='error'>Заполните поля и подтвердите безопасность!</span>";
            return;
        }

        btn.disabled = true;
        btn.innerText = "ОТПРАВКА...";

        const formData = new FormData();
        const message = {
            embeds: [{
                title: "🚨 НОВЫЙ РЕПОРТ",
                color: 9482181,
                fields: [
                    { name: "ОТПРАВИТЕЛЬ", value: username, inline: true },
                    { name: "ОПИСАНИЕ", value: "```" + description + "```" }
                ],
                timestamp: new Date()
            }]
        };

        formData.append("payload_json", JSON.stringify(message));
        if (fileInput.files.length > 0) formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch(WEBHOOK_URL, { method: "POST", body: formData });
            if (response.ok) {
                status.innerHTML = "<span class='success'>Данные переданы.</span>";
                localStorage.setItem('lastReportSent', Date.now());
                document.getElementById('description').value = "";
                fileInput.value = "";
                fileNameDisplay.textContent = "Нажмите или перетащите фото";
                safetyCheck.checked = false;
            } else { throw new Error(); }
        } catch (e) {
            status.innerHTML = "<span class='error'>Ошибка сети.</span>";
        } finally {
            btn.disabled = false;
            btn.innerText = "ОТПРАВИТЬ";
        }
    }
</script>
</body>
</html>
