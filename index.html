<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTESS | Техническая поддержка</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #90afc5;
            --bg: #050505;
            --card-bg: rgba(15, 15, 15, 0.95);
            --discord: #5865F2;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            font-family: 'Exo 2', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at center, #1a1c22 0%, #050505 100%);
            background-attachment: fixed; 
            color: #d1d1d1;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
        }

        .fog-layer {
            position: fixed; top: 0; left: 0; width: 200%; height: 100%;
            background: url('https://raw.githubusercontent.com/gist/PavelDoGreat/6748434/raw/2660233481222479e00ec9a4197e44a49646b5a3/fog.png');
            background-size: 50% 100%; opacity: 0.1; z-index: -1;
            animation: fogMove 80s linear infinite; pointer-events: none;
        }
        @keyframes fogMove { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(144, 175, 197, 0.2);
            border-radius: 20px;
            padding: 40px; width: 90%; max-width: 600px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            text-align: center; box-sizing: border-box; margin: 20px;
        }

        @media (max-width: 600px) {
            .container { padding: 25px 15px; }
            h1 { font-size: 2.2em !important; }
        }

        h1 { font-family: 'Play', sans-serif; font-size: 3.2em; margin: 0; letter-spacing: 8px; color: #fff; }
        .divider { height: 2px; width: 60px; background: var(--accent); margin: 20px auto 35px; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 0.8em; color: #888; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
        
        input, textarea {
            width: 100%; padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; color: #fff; font-family: inherit; font-size: 1em;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); background: rgba(144, 175, 197, 0.05); }

        .drop-zone {
            width: 100%; height: 120px;
            border: 2px dashed rgba(144, 175, 197, 0.3);
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; background: rgba(0, 0, 0, 0.3); color: #888; transition: 0.3s;
        }
        .drop-zone:hover { border-color: var(--accent); color: var(--accent); }

        /* Чекбокс безопасности */
        .safety-check {
            display: flex; align-items: flex-start; gap: 10px;
            text-align: left; font-size: 0.85em; color: #777; margin: 15px 0;
            background: rgba(248, 113, 113, 0.05); padding: 10px; border-radius: 8px;
        }
        .safety-check input { width: auto; margin-top: 3px; cursor: pointer; }

        .btn-main {
            width: 100%; padding: 18px;
            background: var(--accent); color: #000;
            border: none; border-radius: 12px;
            font-weight: bold; font-size: 1.1em;
            text-transform: uppercase; cursor: pointer; transition: 0.4s;
        }
        .btn-main:hover:not(:disabled) { background: #fff; transform: translateY(-3px); }
        .btn-main:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }

        .btn-discord {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 20px; padding: 12px;
            background: rgba(88, 101, 242, 0.1);
            border: 1px solid rgba(88, 101, 242, 0.3);
            border-radius: 12px; color: var(--discord);
            text-decoration: none; font-weight: 600; transition: 0.3s;
        }
        .btn-discord:hover { background: var(--discord); color: #fff; }

        #status { margin-top: 15px; font-size: 0.9em; font-weight: bold; min-height: 1.2em; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="fog-layer"></div>

    <div class="container">
        <h1>RASTESS</h1>
        <div class="divider"></div>
        
        <div class="form-group">
            <label>Ваш ник</label>
            <input type="text" id="username" placeholder="Введите имя..." maxlength="32">
        </div>

        <div class="form-group">
            <label>Описание проблемы</label>
            <textarea id="description" rows="4" placeholder="Что произошло?" maxlength="1000"></textarea>
        </div>

        <div class="form-group">
            <label>Скриншот</label>
            <div class="drop-zone" id="drop-zone">
                <i class="far fa-images" style="font-size: 24px; margin-bottom: 5px;"></i>
                <span id="file-name">Нажмите или перетащите фото</span>
                <input type="file" id="screenshot" style="display:none" accept="image/png, image/jpeg, image/jpg">
            </div>
        </div>

        <div class="safety-check">
            <input type="checkbox" id="safety-confirm">
            <label for="safety-confirm" style="text-transform: none; color: #aaa; font-weight: normal; font-size: 0.95em;">
                Я подтверждаю, что скриншот не содержит запрещенного контента, шок-контента или порнографии.
            </label>
        </div>

        <button class="btn-main" id="submitBtn" onclick="sendReport()">Отправить данные</button>
        <div id="status"></div>

        <a href="https://discord.gg/jzzcdWeJVD" target="_blank" class="btn-discord">
            <i class="fab fa-discord"></i> Наш Discord
        </a>
    </div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('screenshot');
    const fileNameDisplay = document.getElementById('file-name');
    const status = document.getElementById('status');
    const btn = document.getElementById('submitBtn');
    const safetyCheck = document.getElementById('safety-confirm');

    // Огромный список плохих слов
    const bannedWords = [
        "хуй", "пизд", "еба", "ебл", "бля", "сук", "гандон", "мудак", "шлюх", "говно", "жоп", "дроч", "порно", "секс", "члено", "пидор", "ниггер", "негр", "хер", "мразь", "ублюд", "трах", "сиськи"
    ];

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) fileNameDisplay.textContent = `Выбрано: ${fileInput.files[0].name}`;
    });

    async function sendReport() {
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1541545132376203285/DoMDk6qcjb4-1qxweF_Z4WnZT8PIXmBxjhdtX4yYh0QHx1KF9q4Lpf6_5eJ0TzfhnKwX";
        
        const username = document.getElementById('username').value.trim() || "Аноним";
        const description = document.getElementById('description').value.trim();

        // 1. Ограничение 1 мин
        const lastSent = localStorage.getItem('lastReportSent');
        if (lastSent && (Date.now() - lastSent < 60000)) {
            status.innerHTML = "<span class='error'>Подождите минуту!</span>";
            return;
        }

        // 2. Пустое описание
        if (!description) {
            status.innerHTML = "<span class='error'>Опишите проблему!</span>";
            return;
        }

        // 3. Проверка галочки
        if (!safetyCheck.checked) {
            status.innerHTML = "<span class='error'>Подтвердите безопасность контента!</span>";
            return;
        }

        // 4. Фильтр матов
        const textToCheck = (username + " " + description).toLowerCase();
        if (bannedWords.some(word => textToCheck.includes(word))) {
            status.innerHTML = "<span class='error'>Система заблокировала сообщение за мат/оскорбления.</span>";
            return;
        }

        btn.disabled = true;
        btn.innerText = "ОТПРАВКА...";

        const formData = new FormData();
        const message = {
            embeds: [{
                title: "🚨 НОВЫЙ РЕПОРТ",
                color: 9482181,
                fields: [
                    { name: "ОТПРАВИТЕЛЬ", value: username, inline: true },
                    { name: "ОПИСАНИЕ", value: "```" + description + "```" },
                    { name: "БЕЗОПАСНОСТЬ", value: "✅ Пользователь подтвердил отсутствие нарушений" }
                ],
                footer: { text: "RASTESS Security Node" },
                timestamp: new Date()
            }]
        };

        formData.append("payload_json", JSON.stringify(message));
        if (fileInput.files.length > 0) formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch(WEBHOOK_URL, { method: "POST", body: formData });
            if (response.ok) {
                status.innerHTML = "<span class='success'>Данные успешно переданы.</span>";
                localStorage.setItem('lastReportSent', Date.now());
                document.getElementById('description').value = "";
                fileInput.value = "";
                fileNameDisplay.textContent = "Нажмите или перетащите фото";
                safetyCheck.checked = false;
            } else { throw new Error(); }
        } catch (e) {
            status.innerHTML = "<span class='error'>Ошибка сети.</span>";
        } finally {
            btn.disabled = false;
            btn.innerText = "ОТПРАВИТЬ ДАННЫЕ";
        }
    }
</script>
</body>
</html>
