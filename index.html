<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTESS | Терминал связи</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Стилизация под визуальную новеллу */
        @import url('https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Play', sans-serif;
            background: #000;
            color: #d1d1d1;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Атмосферный фон с шумом и туманом */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png'), 
                        radial-gradient(circle, rgba(26,28,34,0) 0%, rgba(0,0,0,0.9) 100%);
            z-index: 1;
        }

        .fog {
            position: fixed;
            width: 200%; height: 100%;
            background: url('https://raw.githubusercontent.com/gist/PavelDoGreat/6748434/raw/2660233481222479e00ec9a4197e44a49646b5a3/fog.png');
            background-repeat: repeat-x;
            opacity: 0.1;
            z-index: 2;
            animation: drift 60s linear infinite;
        }

        @keyframes drift {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Главный контейнер - как окно диалога */
        .game-window {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 550px;
            background: rgba(10, 10, 10, 0.85);
            border: 2px solid rgba(144, 175, 197, 0.3);
            border-radius: 4px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(144, 175, 197, 0.05);
            backdrop-filter: blur(8px);
            animation: windowAppear 0.8s ease-out;
        }

        @keyframes windowAppear {
            from { opacity: 0; transform: scale(0.95); filter: blur(10px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        h1 {
            font-size: 1.8em;
            color: #90afc5;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-top: 0;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(144, 175, 197, 0.2);
            padding-bottom: 10px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 0.8em;
            color: #90afc5;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: block;
        }

        input, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 2px;
            color: #eee;
            padding: 12px;
            font-family: 'Play', sans-serif;
            font-size: 1em;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #90afc5;
            background: rgba(144, 175, 197, 0.1);
        }

        /* Стилизация кнопки выбора файла */
        input[type="file"] {
            border: 1px dashed #444;
            cursor: pointer;
            font-size: 0.9em;
        }

        /* Кнопки меню */
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: none;
            border: 1px solid rgba(144, 175, 197, 0.4);
            color: #90afc5;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .menu-btn:hover {
            background: rgba(144, 175, 197, 0.1);
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(144, 175, 197, 0.3);
        }

        .menu-btn:active { transform: scale(0.98); }

        .discord-btn {
            margin-top: 15px;
            border: 1px solid rgba(88, 101, 242, 0.4);
            color: #5865F2;
            text-decoration: none;
            display: block;
            font-size: 0.9em;
            padding: 10px;
            text-align: center;
        }

        .discord-btn:hover { color: #fff; border-color: #fff; }

        #status {
            margin-top: 20px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .success { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.5); }
        .error { color: #f87171; }

        /* Лоадер в стиле загрузки игры */
        .loader {
            display: none;
            font-size: 0.8em;
            color: #90afc5;
            margin-top: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 
            0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div class="fog"></div>

    <div class="game-window">
        <h1>Система репортов</h1>
        
        <div id="reportForm">
            <div class="form-group">
                <label>Идентификатор (Ник)</label>
                <input type="text" id="username" placeholder="Введите имя...">
            </div>

            <div class="form-group">
                <label>Данные об ошибке</label>
                <textarea id="description" rows="5" placeholder="Опишите баг..."></textarea>
            </div>

            <div class="form-group">
                <label>Визуальное подтверждение</label>
                <input type="file" id="screenshot" accept="image/*">
            </div>

            <button class="menu-btn" id="submitBtn" onclick="sendReport()">
                > Отправить данные
            </button>
            
            <div class="loader" id="spinner">УСТАНОВКА СОЕДИНЕНИЯ...</div>
            <div id="status"></div>
        </div>

        <a href="https://discord.gg/jzzcdWeJVD" target="_blank" class="discord-btn">
            [ ВОЙТИ В DISCORD ]
        </a>
    </div>

<script>
    async function sendReport() {
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1541545132376203285/DoMDk6qcjb4-1qxweF_Z4WnZT8PIXmBxjhdtX4yYh0QHx1KF9q4Lpf6_5eJ0TzfhnKwX";
        
        const username = document.getElementById('username').value || "Неизвестный";
        const description = document.getElementById('description').value;
        const fileInput = document.getElementById('screenshot');
        const status = document.getElementById('status');
        const btn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');

        if (!description) {
            status.innerHTML = "<span class='error'>> ОШИБКА: ОПИСАНИЕ ПУСТО</span>";
            return;
        }

        btn.style.display = "none";
        spinner.style.display = "block";
        status.innerText = "";

        const formData = new FormData();
        
        const message = {
            embeds: [{
                title: "📂 НОВЫЙ ЗАПРОС В ТЕХОТДЕЛ",
                color: 9482181, 
                fields: [
                    { name: "СУБЪЕКТ", value: username, inline: true },
                    { name: "ОТЧЕТ", value: "```" + description + "```" }
                ],
                footer: { text: "RASTESS DEBUG TERMINAL" },
                timestamp: new Date()
            }]
        };

        formData.append("payload_json", JSON.stringify(message));

        if (fileInput.files.length > 0) {
            formData.append("file", fileInput.files[0]);
        }

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: "POST",
                body: formData
            });

            if (response.ok) {
                status.innerHTML = "<span class='success'>> ДАННЫЕ ПЕРЕДАНЫ УСПЕШНО</span>";
                document.getElementById('description').value = "";
                fileInput.value = "";
            } else {
                throw new Error();
            }
        } catch (e) {
            status.innerHTML = "<span class='error'>> ОШИБКА СЕТИ. ПОВТОРИТЕ ПОПЫТКУ</span>";
        } finally {
            btn.style.display = "block";
            spinner.style.display = "none";
        }
    }
</script>

</body>
</html>
