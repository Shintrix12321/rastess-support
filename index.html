<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTESS | Техническая поддержка</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Exo+2:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #90afc5;
            --accent-glow: rgba(144, 175, 197, 0.5);
            --discord: #5865F2;
            --success: #4ade80;
            --error: #f87171;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Exo 2', sans-serif;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background: #0a0a12;
        }

        /* ===== ЖИВОЙ ФОН В СТИЛЕ GLASS (как на фото) ===== */
        .bg-shapes {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            background: radial-gradient(ellipse at 20% 50%, #1a0a2e 0%, #0a0a12 50%, #050510 100%);
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            animation: float 18s ease-in-out infinite;
        }

        .shape-1 {
            width: 520px; height: 520px;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        .shape-2 {
            width: 420px; height: 420px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            bottom: -15%; right: -5%;
            animation-delay: -6s;
        }
        .shape-3 {
            width: 320px; height: 320px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            top: 40%; left: 60%;
            animation-delay: -12s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* ===== СТЕКЛЯННАЯ КАРТОЧКА ===== */
        .container {
            background: rgba(20, 20, 35, 0.55);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 36px;
            width: 90%;
            max-width: 520px;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            text-align: center;
            z-index: 10;
            margin: 40px 20px 20px;
            opacity: 0;
            transform: translateY(28px) scale(0.97);
            animation: cardIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
        }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 600px) {
            .container { padding: 28px 18px; }
            h1 { font-size: 2.3em !important; letter-spacing: 4px !important; }
        }

        h1 {
            font-family: 'Play', sans-serif;
            font-size: 3em;
            margin: 0;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 40px rgba(144, 175, 197, 0.3);
        }

        .divider {
            height: 2px;
            width: 56px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 18px auto 32px;
            border-radius: 2px;
            animation: dividerPulse 2.8s ease-in-out infinite;
        }
        @keyframes dividerPulse {
            0%, 100% { opacity: 0.6; width: 56px; }
            50% { opacity: 1; width: 80px; }
        }

        .form-group { text-align: left; margin-bottom: 18px; }
        label {
            display: block;
            font-size: 0.75em;
            color: #9ca3af;
            margin-bottom: 7px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.8px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 1em;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: rgba(144, 175, 197, 0.6);
            background: rgba(144, 175, 197, 0.08);
            box-shadow: 0 0 0 3px rgba(144, 175, 197, 0.15);
        }
        input:hover:not(:focus), textarea:hover:not(:focus) {
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Drop zone */
        .drop-zone {
            width: 100%;
            height: 110px;
            border: 2px dashed rgba(144, 175, 197, 0.25);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.25);
            color: #9ca3af;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(144, 175, 197, 0.07);
            transform: scale(1.01);
        }
        .drop-zone.has-file {
            border-style: solid;
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(144, 175, 197, 0.1);
        }
        .drop-zone i {
            font-size: 22px;
            margin-bottom: 6px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .drop-zone:hover i {
            transform: scale(1.15) translateY(-2px);
        }

        /* ===== ГАЛОЧКА: рисуется линией + 3D ===== */
        .safety-wrapper {
            display: flex;
            align-items: center;
            cursor: pointer;
            text-align: left;
            gap: 14px;
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.03);
            padding: 13px 15px;
            border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid transparent;
            user-select: none;
            perspective: 800px;
        }
        .safety-wrapper:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(144, 175, 197, 0.15);
        }
        .safety-wrapper:active { transform: scale(0.985); }
        .safety-wrapper input { display: none; }

        .custom-checkbox {
            width: 26px;
            height: 26px;
            border: 2.5px solid #555;
            border-radius: 7px;
            position: relative;
            flex-shrink: 0;
            background: rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .safety-wrapper input:checked + .custom-checkbox {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(144, 175, 197, 0.25),
                        0 0 20px var(--accent-glow);
            transform: rotateY(360deg) scale(1.08);
            animation: check3d 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes check3d {
            0%   { transform: rotateY(0deg) scale(0.8); }
            45%  { transform: rotateY(200deg) scale(1.2); }
            100% { transform: rotateY(360deg) scale(1.08); }
        }

        .custom-checkbox svg {
            position: absolute;
            top: 50%; left: 50%;
            width: 16px; height: 16px;
            transform: translate(-50%, -50%);
            overflow: visible;
        }

        .custom-checkbox svg path {
            fill: none;
            stroke: #0a0a0a;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            transition: stroke-dashoffset 0.38s cubic-bezier(0.65, 0, 0.35, 1) 0.12s;
        }

        .safety-wrapper input:checked + .custom-checkbox svg path {
            stroke-dashoffset: 0;
        }

        .safety-text {
            font-size: 0.88em;
            color: #a1a1aa;
            line-height: 1.4;
            transition: color 0.3s ease;
        }
        .safety-wrapper input:checked ~ .safety-text {
            color: #d4d4d8;
        }

        /* ===== КНОПКА ===== */
        .btn-main {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #90afc5, #a5c4d8);
            color: #0a0a12;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.1em;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 8px 24px rgba(144, 175, 197, 0.3);
        }
        .btn-main::before {
            content: '';
            position: absolute;
            top: 0; left: -80%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.55s ease;
        }
        .btn-main:hover:not(:disabled)::before { left: 140%; }
        .btn-main:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 32px rgba(144, 175, 197, 0.45);
            background: #fff;
        }
        .btn-main:active:not(:disabled) {
            transform: translateY(-1px) scale(0.98);
            transition-duration: 0.1s;
        }
        .btn-main:disabled {
            background: #3f3f46;
            color: #71717a;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .btn-main.sending {
            animation: pulseBtn 1.1s ease-in-out infinite;
        }
        @keyframes pulseBtn {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }

        .btn-discord {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 22px;
            padding: 12px;
            background: rgba(88, 101, 242, 0.12);
            border: 1px solid rgba(88, 101, 242, 0.3);
            border-radius: 14px;
            color: #a5b4fc;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-discord:hover {
            background: var(--discord);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(88, 101, 242, 0.4);
            border-color: var(--discord);
        }
        .btn-discord:active { transform: scale(0.97); }
        .btn-discord i {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-discord:hover i {
            transform: scale(1.2) rotate(-6deg);
        }

        /* Платформы */
        .platform-section {
            text-align: center;
            margin: 10px 0 50px;
            z-index: 10;
            opacity: 0;
            transform: translateY(16px);
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
        }
        .platform-title {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 14px;
        }
        .platform-footer {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .platform-link {
            text-decoration: none;
            color: #d4d4d8;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .platform-link:hover {
            color: #fff;
            border-color: var(--accent);
            background: rgba(144, 175, 197, 0.15);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 20px rgba(144, 175, 197, 0.2);
        }
        .platform-link:active { transform: scale(0.97); }
        .platform-link i {
            font-size: 1.15em;
            color: var(--accent);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .platform-link:hover i { transform: scale(1.2); }

        #status {
            margin-top: 14px;
            font-size: 0.92em;
            font-weight: 600;
            min-height: 1.3em;
            opacity: 0;
            transform: translateY(6px);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #status.show {
            opacity: 1;
            transform: translateY(0);
        }
        .success { color: var(--success); }
        .error { color: var(--error); }

        .success-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px; height: 20px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 7px;
            animation: successPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .success-check i {
            color: #000;
            font-size: 11px;
            transform: scale(0);
            animation: checkMarkIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) 0.12s forwards;
        }
        @keyframes successPop {
            0% { transform: scale(0); }
            60% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        @keyframes checkMarkIn {
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <h1>RASTESS</h1>
        <div class="divider"></div>
        
        <div class="form-group">
            <label>Объект (Ваш ник)</label>
            <input type="text" id="username" placeholder="Введите имя..." maxlength="32">
        </div>

        <div class="form-group">
            <label>Описание обнаруженной ошибки</label>
            <textarea id="description" rows="4" placeholder="Что произошло в тумане?"></textarea>
        </div>

        <div class="form-group">
            <label>Визуальные данные</label>
            <div class="drop-zone" id="drop-zone">
                <i class="far fa-images"></i>
                <span id="file-name">Нажмите или перетащите фото</span>
                <input type="file" id="screenshot" style="display:none" accept="image/png, image/jpeg, image/jpg">
            </div>
        </div>

        <label class="safety-wrapper" for="safety-confirm">
            <input type="checkbox" id="safety-confirm">
            <div class="custom-checkbox">
                <svg viewBox="0 0 24 24">
                    <path d="M4 12.5L9.5 18L20 6"></path>
                </svg>
            </div>
            <div class="safety-text">Я подтверждаю, что скриншот не содержит запрещенного контента.</div>
        </label>

        <button class="btn-main" id="submitBtn" onclick="sendReport()">Отправить</button>
        <div id="status"></div>

        <a href="https://discord.gg/jzzcdWeJVD" target="_blank" class="btn-discord">
            <i class="fab fa-discord"></i> Наш Discord
        </a>
    </div>

    <div class="platform-section">
        <div class="platform-title">Играть на платформах</div>
        <div class="platform-footer">
            <a href="https://shintrix.itch.io/rastess" target="_blank" class="platform-link">
                <i class="fab fa-itch-io"></i> Itch.io
            </a>
            <a href="https://gamejolt.com/games/rastess/1094649" target="_blank" class="platform-link">
                <i class="fas fa-gamepad"></i> GameJolt
            </a>
        </div>
    </div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('screenshot');
    const fileNameDisplay = document.getElementById('file-name');
    const status = document.getElementById('status');
    const btn = document.getElementById('submitBtn');
    const safetyCheck = document.getElementById('safety-confirm');

    const bannedWords = ["хуй", "пизд", "еба", "ебл", "бля", "сук", "гандон", "мудак", "шлюх", "говно", "жоп", "дроч", "порно", "секс", "пидор", "ниггер", "негр", "хер", "мразь"];

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
            fileNameDisplay.textContent = `Выбрано: ${fileInput.files[0].name}`;
            dropZone.classList.add('has-file');
        } else {
            fileNameDisplay.textContent = 'Нажмите или перетащите фото';
            dropZone.classList.remove('has-file');
        }
    });

    ['dragenter', 'dragover'].forEach(evt => {
        dropZone.addEventListener(evt, e => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('drag-over');
        });
    });
    ['dragleave', 'drop'].forEach(evt => {
        dropZone.addEventListener(evt, e => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('drag-over');
        });
    });
    dropZone.addEventListener('drop', e => {
        const files = e.dataTransfer.files;
        if (files.length && files[0].type.startsWith('image/')) {
            fileInput.files = files;
            fileNameDisplay.textContent = `Выбрано: ${files[0].name}`;
            dropZone.classList.add('has-file');
        }
    });

    function showStatus(html) {
        status.innerHTML = html;
        status.classList.remove('show');
        void status.offsetWidth;
        status.classList.add('show');
    }

    async function sendReport() {
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1541545132376203285/DoMDk6qcjb4-1qxweF_Z4WnZT8PIXmBxjhdtX4yYh0QHx1KF9q4Lpf6_5eJ0TzfhnKwX";
        const username = document.getElementById('username').value.trim() || "Аноним";
        const description = document.getElementById('description').value.trim();

        const lastSent = localStorage.getItem('lastReportSent');
        if (lastSent && (Date.now() - lastSent < 60000)) {
            showStatus("<span class='error'>Подождите минуту.</span>");
            return;
        }
        if (!description || !safetyCheck.checked) {
            showStatus("<span class='error'>Заполните поля и подтвердите безопасность!</span>");
            return;
        }

        const textToCheck = (username + " " + description).toLowerCase();
        if (bannedWords.some(word => textToCheck.includes(word))) {
            showStatus("<span class='error'>Сообщение отклонено системой безопасности.</span>");
            return;
        }

        btn.disabled = true;
        btn.classList.add('sending');
        btn.innerText = "ОТПРАВКА...";

        const formData = new FormData();
        const message = {
            embeds: [{
                title: "🚨 НОВЫЙ РЕПОРТ",
                color: 9482181,
                fields: [
                    { name: "ОТПРАВИТЕЛЬ", value: username, inline: true },
                    { name: "ОТЧЕТ", value: "```" + description + "```" }
                ],
                timestamp: new Date()
            }]
        };

        formData.append("payload_json", JSON.stringify(message));
        if (fileInput.files.length > 0) formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch(WEBHOOK_URL, { method: "POST", body: formData });
            if (response.ok) {
                showStatus("<span class='success'><span class='success-check'><i class=\"fas fa-check\"></i></span>Отчет доставлен.</span>");
                localStorage.setItem('lastReportSent', Date.now());
                document.getElementById('description').value = "";
                fileInput.value = "";
                fileNameDisplay.textContent = "Нажмите или перетащите фото";
                dropZone.classList.remove('has-file');
                safetyCheck.checked = false;
            } else { throw new Error(); }
        } catch (e) {
            showStatus("<span class='error'>Ошибка сети.</span>");
        } finally {
            btn.disabled = false;
            btn.classList.remove('sending');
            btn.innerText = "ОТПРАВИТЬ";
        }
    }
</script>
</body>
</html>
