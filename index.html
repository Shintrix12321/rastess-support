<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTESS | Поддержка и Сообщество</title>
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Основной стиль страницы */
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 50%, #1a1c22 0%, #050505 100%);
            color: #d1d1d1;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Анимация появления контента */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Эффект тумана/текстуры на фоне */
        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            opacity: 0.15;
            z-index: -1;
        }

        /* Главная карточка */
        .container {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 60px 45px;
            border-radius: 28px;
            border: 1px solid rgba(144, 175, 197, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 420px;
            width: 85%;
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            color: #90afc5;
            font-size: 2.8em;
            margin: 0 0 10px 0;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 300;
            text-shadow: 0 0 15px rgba(144, 175, 197, 0.3);
        }

        .subtitle {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 45px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Стили кнопок */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px;
            margin-bottom: 18px;
            text-decoration: none;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1.05em;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Кнопка GitHub (Ошибки) */
        .btn-bug {
            background: #90afc5;
            color: #0a0a0a;
        }
        .btn-bug:hover {
            background: #fff;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(144, 175, 197, 0.4);
        }

        /* Кнопка Discord */
        .btn-discord {
            background: #5865F2;
            color: #ffffff;
        }
        .btn-discord:hover {
            background: #7289da;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(88, 101, 242, 0.4);
        }

        /* Подвал карточки */
        .footer-info {
            margin-top: 35px;
            font-size: 0.8em;
            color: #444;
            line-height: 1.6;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }

        .footer-info b {
            color: #777;
        }

        /* Адаптация под телефоны */
        @media (max-width: 480px) {
            .container { padding: 40px 25px; }
            h1 { font-size: 2.2em; }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="container">
        <h1>RASTESS</h1>
        <div class="subtitle">Технический узел</div>
        
        <!-- Ссылка на создание Issue в твоем репозитории -->
        <a href="https://github.com/Shintrix12321/rastess-support/issues/new" target="_blank" class="btn btn-bug">
            <i class="fas fa-bug"></i> Сообщить о баге
        </a>

        <!-- Твоя ссылка на Discord -->
        <a href="https://discord.gg/jzzcdWeJVD" target="_blank" class="btn btn-discord">
            <i class="fab fa-discord"></i> Наш Discord
        </a>

        <div class="footer-info">
            Нашли проблему в тумане? <br>
            Опишите баг и прикрепите <b>скриншот</b>, <br>
            просто перетащив его в поле текста на GitHub.
        </div>
    </div>
</body>
</html>
