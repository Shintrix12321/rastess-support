<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTESS | Техническая поддержка</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #90afc5;
            --bg: #050505;
            --card-bg: rgba(15, 15, 15, 0.9);
        }

        /* Исправляем фон, чтобы не было квадратов */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh; /* Растягиваем на всю высоту */
            font-family: 'Exo 2', sans-serif;
            background-color: var(--bg);
            /* Градиент теперь покрывает ВЕСЬ экран без разрывов */
            background-image: radial-gradient(circle at center, #1a1c22 0%, #050505 100%);
            background-attachment: fixed; 
            color: #d1d1d1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Эффект тумана на весь экран */
        .fog-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: url('https://raw.githubusercontent.com/gist/PavelDoGreat/6748434/raw/2660233481222479e00ec9a4197e44a49646b5a3/fog.png');
            background-size: 50% 100%;
            opacity: 0.1;
            z-index: -1;
            animation: fogMove 80s linear infinite;
            pointer-events: none;
        }
        @keyframes fogMove { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* Делаем менюшку БОЛЬШЕ */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(144, 175, 197, 0.2);
            border-radius: 20px;
            padding: 60px; /* Увеличили внутренние отступы */
            width: 95%;
            max-width: 650px; /* Увеличили максимальную ширину */
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            text-align: center;
            box-sizing: border-box;
            margin: 20px 0; /* Чтобы не прилипало к краям на мобилках */
        }

        h1 { font-family: 'Play', sans-serif; font-size: 3.5em; margin: 0; letter-spacing: 10px; color: #fff; }
        .divider { height: 2px; width: 80px; background: var(--accent); margin: 20px auto 40px; }

        .form-group { text-align: left; margin-bottom: 25px; }
        label { display: block; font-size: 0.85em; color: #888; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; letter-spacing: 1.5px; }
        
        input, textarea {
            width: 100%; padding: 18px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: #fff;
            font-family: inherit; font-size: 1.1em;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); background: rgba(144, 175, 197, 0.05); }

        /* Зона загрузки скриншота */
        .drop-zone {
            width: 100%; height: 160px; /* Сделали выше */
            border: 2px dashed rgba(144, 175, 197, 0.3);
            border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            background: rgba(0, 0, 0, 0.3);
            color: #888;
        }
        .drop-zone:hover { border-color: var(--accent); color: var(--accent); background: rgba(144, 175, 197, 0.05); }
        .drop-zone__icon { font-size: 35px; margin-bottom: 10px; }
        .drop-zone__text { font-size: 1em; }
        .drop-zone__thumb { font-size: 0.9em; color: var(--accent); margin-top: 10px; font-weight: bold; }

        /* Кнопка "Отправить" */
        .btn-main {
            width: 100%; padding: 20px;
            background: var(--accent); color: #000;
            border: none; border-radius: 15px;
            font-weight: bold; font-size: 1.2em;
            text-transform: uppercase; cursor: pointer;
            transition: 0.4s; margin-top: 20px;
            letter-spacing: 2px;
        }
        .btn-main:hover { background: #fff; transform: translateY(-3px); box-shadow: 0 15px 30px rgba(144, 175, 197, 0.3); }

        #status { margin-top: 20px; font-size: 1em; font-weight: bold; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="fog-layer"></div>

    <div class="container">
        <h1>RASTESS</h1>
        <div class="divider"></div>
        
        <div class="form-group">
            <label>Объект (Ваш ник)</label>
            <input type="text" id="username" placeholder="Введите имя..." required>
        </div>

        <div class="form-group">
            <label>Суть проблемы</label>
            <textarea id="description" rows="4" placeholder="Опишите баг..."></textarea>
        </div>

        <div class="form-group">
            <label>Визуальные данные</label>
            <div class="drop-zone" id="drop-zone">
                <i class="far fa-images drop-zone__icon"></i>
                <span class="drop-zone__text">Перетащите скриншот сюда или нажмите</span>
                <input type="file" id="screenshot" style="display:none" accept="image/*">
                <div id="file-name" class="drop-zone__thumb"></div>
            </div>
        </div>

        <button class="btn-main" id="submitBtn" onclick="sendReport()">Отправить</button>
        <div id="status"></div>
    </div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('screenshot');
    const fileNameDisplay = document.getElementById('file-name');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) fileNameDisplay.textContent = `Выбрано: ${fileInput.files[0].name}`;
    });

    // Drag and drop
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = "#90afc5"; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = "rgba(144, 175, 197, 0.3)"; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        fileInput.files = e.dataTransfer.files;
        if (fileInput.files.length) fileNameDisplay.textContent = `Выбрано: ${fileInput.files[0].name}`;
        dropZone.style.borderColor = "rgba(144, 175, 197, 0.3)";
    });

    async function sendReport() {
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1541545132376203285/DoMDk6qcjb4-1qxweF_Z4WnZT8PIXmBxjhdtX4yYh0QHx1KF9q4Lpf6_5eJ0TzfhnKwX";
        const username = document.getElementById('username').value || "Аноним";
        const description = document.getElementById('description').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('submitBtn');

        if (!description) {
            status.innerHTML = "<span class='error'>Ошибка: Опишите проблему</span>";
            return;
        }

        btn.disabled = true;
        btn.innerText = "Отправка...";

        const formData = new FormData();
        const message = {
            embeds: [{
                title: "🚨 Зафиксирована ошибка",
                color: 9482181,
                fields: [
                    { name: "СУБЪЕКТ", value: username, inline: true },
                    { name: "ОТЧЕТ", value: "```" + description + "```" }
                ],
                footer: { text: "RASTESS Support" },
                timestamp: new Date()
            }]
        };

        formData.append("payload_json", JSON.stringify(message));
        if (fileInput.files.length > 0) formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch(WEBHOOK_URL, { method: "POST", body: formData });
            if (response.ok) {
                status.innerHTML = "<span class='success'>Отчет успешно отправлен!</span>";
                document.getElementById('description').value = "";
                fileInput.value = "";
                fileNameDisplay.textContent = "";
            } else { throw new Error(); }
        } catch (e) {
            status.innerHTML = "<span class='error'>Ошибка сети. Попробуйте позже.</span>";
        } finally {
            btn.disabled = false;
            btn.innerText = "Отправить";
        }
    }
</script>
</body>
</html>
