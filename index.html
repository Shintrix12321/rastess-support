<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Растесс | Техподдержка</title>
    <style>
        body { background: #0d0d0d; color: #d1d1d1; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #161616; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; max-width: 400px; border: 1px solid #222; }
        h1 { color: #90afc5; letter-spacing: 2px; }
        p { color: #888; font-size: 0.9em; margin-bottom: 30px; }
        .btn { display: block; background: #90afc5; color: #0d0d0d; padding: 15px; text-decoration: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: #fff; transform: translateY(-3px); }
        .info { margin-top: 20px; font-size: 0.8em; color: #555; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <h1>RASTESS</h1>
        <p>Центр регистрации ошибок</p>
        
        <!-- ВНИМАНИЕ! ЗАМЕНИ ССЫЛКУ НИЖЕ НА СВОЮ -->
        <a href="https://github.com/Shintrix12321/rastess-support/issues/new" class="btn">Сообщить о баге</a>

        <div class="info">
            После нажатия кнопки вы попадете на страницу GitHub. <br><br>
            Опишите проблему и <b>просто перетащите скриншот в поле текста</b> — он прикрепится автоматически.
        </div>
    </div>
</body>
</html>
