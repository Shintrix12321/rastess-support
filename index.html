<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASTESS | Техническая поддержка</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #90afc5;
            --accent-glow: rgba(144, 175, 197, 0.45);
            --bg: #050505;
            --card-bg: rgba(15, 15, 15, 0.95);
            --discord: #5865F2;
            --success: #4ade80;
            --error: #f87171;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            font-family: 'Exo 2', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at center, #1a1c22 0%, #050505 100%);
            background-attachment: fixed;
            color: #d1d1d1;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow-x: hidden;
        }

        .fog-layer {
            position: fixed; top: 0; left: 0; width: 200%; height: 100%;
            background: url('https://raw.githubusercontent.com/gist/PavelDoGreat/6748434/raw/2660233481222479e00ec9a4197e44a49646b5a3/fog.png');
            background-size: 50% 100%; opacity: 0.1; z-index: -1;
            animation: fogMove 80s linear infinite; pointer-events: none;
        }
        @keyframes fogMove { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(144, 175, 197, 0.2);
            border-radius: 20px;
            padding: 40px; width: 90%; max-width: 600px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            text-align: center; box-sizing: border-box; margin: 40px 20px 20px;
            z-index: 10;
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
        }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 600px) {
            .container { padding: 25px 15px; }
            h1 { font-size: 2.2em !important; }
        }

        h1 {
            font-family: 'Play', sans-serif; font-size: 3.2em; margin: 0;
            letter-spacing: 8px; color: #fff;
            text-shadow: 0 0 30px rgba(144, 175, 197, 0.25);
        }
        .divider {
            height: 2px; width: 60px; background: var(--accent);
            margin: 20px auto 35px;
            border-radius: 2px;
            box-shadow: 0 0 12px var(--accent-glow);
            animation: dividerPulse 2.5s ease-in-out infinite;
        }
        @keyframes dividerPulse {
            0%, 100% { opacity: 0.7; width: 60px; }
            50% { opacity: 1; width: 80px; }
        }

        .form-group { text-align: left; margin-bottom: 20px; }
        label {
            display: block; font-size: 0.8em; color: #888;
            margin-bottom: 8px; text-transform: uppercase; font-weight: bold;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%; padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: #fff; font-family: inherit; font-size: 1em;
            box-sizing: border-box;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(144, 175, 197, 0.08);
            box-shadow: 0 0 0 4px rgba(144, 175, 197, 0.15),
                        0 8px 24px rgba(0,0,0,0.3);
            transform: translateY(-1px);
        }
        input:hover:not(:focus), textarea:hover:not(:focus) {
            border-color: rgba(144, 175, 197, 0.35);
        }

        .drop-zone {
            width: 100%; height: 120px;
            border: 2px dashed rgba(144, 175, 197, 0.3);
            border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.3);
            color: #888;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }
        .drop-zone::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(144,175,197,0.12) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(144, 175, 197, 0.06);
            transform: scale(1.015);
            box-shadow: 0 0 30px rgba(144, 175, 197, 0.12);
        }
        .drop-zone:hover::before, .drop-zone.drag-over::before { opacity: 1; }
        .drop-zone.has-file {
            border-style: solid;
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(144, 175, 197, 0.08);
        }
        .drop-zone i {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .drop-zone:hover i, .drop-zone.drag-over i {
            transform: scale(1.2) translateY(-2px);
        }

        /* ===== ГАЛОЧКА: рисуется + 3D + bounce ===== */
        .safety-wrapper {
            display: flex; align-items: center; cursor: pointer;
            text-align: left; gap: 16px; margin: 22px 0;
            background: rgba(255, 255, 255, 0.02);
            padding: 14px 16px; border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid transparent;
            user-select: none;
            perspective: 600px;
        }
        .safety-wrapper:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(144, 175, 197, 0.15);
            transform: translateY(-1px);
        }
        .safety-wrapper:active {
            transform: scale(0.985);
        }
        .safety-wrapper input { display: none; }

        .custom-checkbox {
            width: 28px; height: 28px;
            border: 2.5px solid #555;
            border-radius: 8px;
            position: relative; flex-shrink: 0;
            background: rgba(0,0,0,0.35);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        /* 3D поворот + заполнение */
        .safety-wrapper input:checked + .custom-checkbox {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(144, 175, 197, 0.28),
                        0 0 22px var(--accent-glow);
            transform: rotateY(360deg) scale(1.1);
            animation: check3d 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes check3d {
            0%   { transform: rotateY(0deg) scale(0.85); }
            40%  { transform: rotateY(180deg) scale(1.2); }
            100% { transform: rotateY(360deg) scale(1.1); }
        }

        /* SVG галочка, которая рисуется */
        .custom-checkbox svg {
            position: absolute;
            top: 50%; left: 50%;
            width: 18px; height: 18px;
            transform: translate(-50%, -50%);
            overflow: visible;
        }

        .custom-checkbox svg path {
            fill: none;
            stroke: #0a0a0a;
            stroke-width: 3.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            transition: stroke-dashoffset 0.35s cubic-bezier(0.65, 0, 0.35, 1) 0.15s;
        }

        .safety-wrapper input:checked + .custom-checkbox svg path {
            stroke-dashoffset: 0;
        }

        .safety-text {
            font-size: 0.9em; color: #aaa;
            line-height: 1.4;
            transition: color 0.3s ease;
        }
        .safety-wrapper input:checked ~ .safety-text {
            color: #c8dce8;
        }

        /* ===== КНОПКА ОТПРАВИТЬ ===== */
        .btn-main {
            width: 100%; padding: 18px;
            background: var(--accent);
            color: #000;
            border: none; border-radius: 14px;
            font-weight: bold; font-size: 1.15em;
            text-transform: uppercase; cursor: pointer;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 8px 24px rgba(144, 175, 197, 0.25);
        }
        .btn-main::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            transition: left 0.55s ease;
        }
        .btn-main:hover:not(:disabled)::before {
            left: 140%;
        }
        .btn-main:hover:not(:disabled) {
            background: #fff;
            color: #000;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 36px rgba(255, 255, 255, 0.35),
                        0 0 40px rgba(144, 175, 197, 0.3);
        }
        .btn-main:active:not(:disabled) {
            transform: translateY(-1px) scale(0.97);
            box-shadow: 0 4px 14px rgba(144, 175, 197, 0.3);
            transition-duration: 0.12s;
        }
        .btn-main:disabled {
            background: #3a3a3a;
            color: #777;
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
            transform: none;
        }
        .btn-main.sending {
            animation: pulseBtn 1.2s ease-in-out infinite;
        }
        @keyframes pulseBtn {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }

        .btn-discord {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 25px; padding: 13px;
            background: rgba(88, 101, 242, 0.1);
            border: 1px solid rgba(88, 101, 242, 0.3);
            border-radius: 14px;
            color: var(--discord);
            text-decoration: none; font-weight: 600;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-discord:hover {
            background: var(--discord);
            color: #fff;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 28px rgba(88, 101, 242, 0.45);
            border-color: var(--discord);
        }
        .btn-discord:active {
            transform: translateY(0) scale(0.97);
            transition-duration: 0.12s;
        }
        .btn-discord i {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-discord:hover i {
            transform: scale(1.2) rotate(-8deg);
        }

        .platform-section {
            text-align: center; margin-top: 10px; margin-bottom: 50px; z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
        }
        .platform-title {
            font-size: 0.8em; text-transform: uppercase; letter-spacing: 3px;
            color: #fff; margin-bottom: 15px; opacity: 0.5;
        }
        .platform-footer {
            display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
        }
        .platform-link {
            text-decoration: none; color: #ddd;
            font-size: 0.9em; display: flex; align-items: center; gap: 8px;
            padding: 11px 22px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .platform-link:hover {
            color: #fff;
            border-color: var(--accent);
            background: rgba(144, 175, 197, 0.18);
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 10px 25px rgba(144, 175, 197, 0.2);
        }
        .platform-link:active {
            transform: translateY(-1px) scale(0.97);
            transition-duration: 0.12s;
        }
        .platform-link i {
            font-size: 1.2em; color: var(--accent);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .platform-link:hover i {
            transform: scale(1.25);
        }

        #status {
            margin-top: 16px;
            font-size: 0.95em;
            font-weight: bold;
            min-height: 1.4em;
            opacity: 0;
            transform: translateY(6px);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #status.show {
            opacity: 1;
            transform: translateY(0);
        }
        .success { color: var(--success); text-shadow: 0 0 12px rgba(74, 222, 128, 0.35); }
        .error { color: var(--error); text-shadow: 0 0 12px rgba(248, 113, 113, 0.3); }

        .success-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px; height: 22px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 8px;
            animation: successPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .success-check i {
            color: #000;
            font-size: 12px;
            transform: scale(0);
            animation: checkMarkIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
        }
        @keyframes successPop {
            0% { transform: scale(0); }
            60% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        @keyframes checkMarkIn {
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="fog-layer"></div>

    <div class="container">
        <h1>RASTESS</h1>
        <div class="divider"></div>
        
        <div class="form-group">
            <label>Объект (Ваш ник)</label>
            <input type="text" id="username" placeholder="Введите имя..." maxlength="32">
        </div>

        <div class="form-group">
            <label>Описание обнаруженной ошибки</label>
            <textarea id="description" rows="4" placeholder="Что произошло в тумане?"></textarea>
        </div>

        <div class="form-group">
            <label>Визуальные данные</label>
            <div class="drop-zone" id="drop-zone">
                <i class="far fa-images" style="font-size: 24px; margin-bottom: 5px;"></i>
                <span id="file-name">Нажмите или перетащите фото</span>
                <input type="file" id="screenshot" style="display:none" accept="image/png, image/jpeg, image/jpg">
            </div>
        </div>

        <label class="safety-wrapper" for="safety-confirm">
            <input type="checkbox" id="safety-confirm">
            <div class="custom-checkbox">
                <svg viewBox="0 0 24 24">
                    <path d="M4 12.5L9.5 18L20 6"></path>
                </svg>
            </div>
            <div class="safety-text">Я подтверждаю, что скриншот не содержит запрещенного контента.</div>
        </label>

        <button class="btn-main" id="submitBtn" onclick="sendReport()">Отправить</button>
        <div id="status"></div>

        <a href="https://discord.gg/jzzcdWeJVD" target="_blank" class="btn-discord">
            <i class="fab fa-discord"></i> Наш Discord
        </a>
    </div>

    <div class="platform-section">
        <div class="platform-title">Играть на платформах</div>
        <div class="platform-footer">
            <a href="https://shintrix.itch.io/rastess" target="_blank" class="platform-link">
                <i class="fab fa-itch-io"></i> Itch.io
            </a>
            <a href="https://gamejolt.com/games/rastess/1094649" target="_blank" class="platform-link">
                <i class="fas fa-gamepad"></i> GameJolt
            </a>
        </div>
    </div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('screenshot');
    const fileNameDisplay = document.getElementById('file-name');
    const status = document.getElementById('status');
    const btn = document.getElementById('submitBtn');
    const safetyCheck = document.getElementById('safety-confirm');

    const bannedWords = ["хуй", "пизд", "еба", "ебл", "бля", "сук", "гандон", "мудак", "шлюх", "говно", "жоп", "дроч", "порно", "секс", "пидор", "ниггер", "негр", "хер", "мразь"];

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
            fileNameDisplay.textContent = `Выбрано: ${fileInput.files[0].name}`;
            dropZone.classList.add('has-file');
        } else {
            fileNameDisplay.textContent = 'Нажмите или перетащите фото';
            dropZone.classList.remove('has-file');
        }
    });

    ['dragenter', 'dragover'].forEach(evt => {
        dropZone.addEventListener(evt, e => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('drag-over');
        });
    });
    ['dragleave', 'drop'].forEach(evt => {
        dropZone.addEventListener(evt, e => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('drag-over');
        });
    });
    dropZone.addEventListener('drop', e => {
        const files = e.dataTransfer.files;
        if (files.length && files[0].type.startsWith('image/')) {
            fileInput.files = files;
            fileNameDisplay.textContent = `Выбрано: ${files[0].name}`;
            dropZone.classList.add('has-file');
        }
    });

    function showStatus(html) {
        status.innerHTML = html;
        status.classList.remove('show');
        void status.offsetWidth;
        status.classList.add('show');
    }

    async function sendReport() {
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1541545132376203285/DoMDk6qcjb4-1qxweF_Z4WnZT8PIXmBxjhdtX4yYh0QHx1KF9q4Lpf6_5eJ0TzfhnKwX";
        const username = document.getElementById('username').value.trim() || "Аноним";
        const description = document.getElementById('description').value.trim();

        const lastSent = localStorage.getItem('lastReportSent');
        if (lastSent && (Date.now() - lastSent < 60000)) {
            showStatus("<span class='error'>Подождите минуту.</span>");
            return;
        }
        if (!description || !safetyCheck.checked) {
            showStatus("<span class='error'>Заполните поля и подтвердите безопасность!</span>");
            return;
        }

        const textToCheck = (username + " " + description).toLowerCase();
        if (bannedWords.some(word => textToCheck.includes(word))) {
            showStatus("<span class='error'>Сообщение отклонено системой безопасности.</span>");
            return;
        }

        btn.disabled = true;
        btn.classList.add('sending');
        btn.innerText = "ОТПРАВКА...";

        const formData = new FormData();
        const message = {
            embeds: [{
                title: "🚨 НОВЫЙ РЕПОРТ",
                color: 9482181,
                fields: [
                    { name: "ОТПРАВИТЕЛЬ", value: username, inline: true },
                    { name: "ОТЧЕТ", value: "```" + description + "```" }
                ],
                timestamp: new Date()
            }]
        };

        formData.append("payload_json", JSON.stringify(message));
        if (fileInput.files.length > 0) formData.append("file", fileInput.files[0]);

        try {
            const response = await fetch(WEBHOOK_URL, { method: "POST", body: formData });
            if (response.ok) {
                showStatus("<span class='success'><span class='success-check'><i class=\"fas fa-check\"></i></span>Отчет доставлен.</span>");
                localStorage.setItem('lastReportSent', Date.now());
                document.getElementById('description').value = "";
                fileInput.value = "";
                fileNameDisplay.textContent = "Нажмите или перетащите фото";
                dropZone.classList.remove('has-file');
                safetyCheck.checked = false;
            } else { throw new Error(); }
        } catch (e) {
            showStatus("<span class='error'>Ошибка сети.</span>");
        } finally {
            btn.disabled = false;
            btn.classList.remove('sending');
            btn.innerText = "ОТПРАВИТЬ";
        }
    }
</script>
</body>
</html>
